# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Fabric properties -- pulled directly from FabricMC/fabric-example-mod's
# 26.2 branch (the authoritative source) on 2026-09-12. Re-check against
# https://fabricmc.net/develop if these ever drift.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod properties
version=0.1.0
group=com.ayesha.echoes
archives_base_name=echoes

# Dependencies
fabric_api_version=0.159.0+26.2

# Test dependencies. JUnit 6 targets Java 17+, which suits this project's
# Java 25 toolchain. The org.junit.jupiter.api surface the tests use is
# unchanged from JUnit 5, so this is a safe bump.
junit_version=6.1.2
