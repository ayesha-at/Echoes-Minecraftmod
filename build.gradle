plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Needed for JUnit. The Minecraft and Fabric artifacts come from the
	// repositories Loom adds for itself.
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// The recording/ and playback/ data model is deliberately free of Minecraft
// types so it can be unit-tested as plain Java -- no game bootstrap, no
// registries, no headless client. The tests therefore run in milliseconds and
// are cheap enough to gate every push on.
//
// NOTE: there is deliberately no custom sourceSets{} block here. Gradle's
// Java plugin already makes testImplementation extend